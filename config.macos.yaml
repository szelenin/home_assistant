# Home Assistant Configuration - macOS
# This file contains macOS-specific settings optimized for Mac hardware and software

ai:
  config_file: ai_config.yaml
  provider: anthropic

audio:
  chunk_size: 512
  sample_rate: 16000
  # macOS uses system default audio devices
  device_patterns: []  # Empty list uses system default

speech:
  provider: whisper  # Free, offline, very accurate on Mac
  language: en
  providers:
    vosk:
      model_path: "./vosk-model-small-en-us-0.15"
      confidence_threshold: 0.0
      sample_rate: 16000
    google:
      show_all: false
    whisper:
      model: base
      device: cpu
      temperature: 0.0

tts:
  provider: pyttsx  # Native macOS TTS with high quality voices
  providers:
    pyttsx:
      voice_id: com.apple.voice.compact.en-US.Samantha
      rate: 150
      volume: 0.5
    espeak:
      voice: en
      rate: 175
      volume: 80
      pitch: 50
      gap: 0
    piper:
      model: en_US-lessac-medium
      rate: 1.0
      volume: 1.0
      speaker_id: null
      output_raw: false

wake_word:
  name: jarvis
  sensitivity: 0.5
  detection:
    provider: pocketsphinx  # Reliable for macOS
    providers:
      openwakeword:
        model_path: "./openwakeword_models"
        threshold: 0.001
        inference_framework: "onnx"
      porcupine:
        access_key: "your-picovoice-key-here"
        keyword_path: null
      pocketsphinx:
        hmm_path: null
        dict_path: null
        keyphrase_threshold: 0.00000000000000000001

# Logging
logging:
  level: INFO
  file: logs/home_assistant.log
  max_bytes: 10485760  # 10 MB
  backup_count: 5