# Jarvis Satellite Configuration
# Generated by install.sh - edit as needed

# =============================================================================
# MAC SERVER CONNECTION
# =============================================================================
# IP address of your Mac running the Wyoming server
MAC_SERVER_IP="192.168.86.26"

# Wyoming server port (default: 10700)
MAC_SERVER_PORT="10700"

# =============================================================================
# AUDIO DEVICES
# =============================================================================
# Find devices with: arecord -l (for mic) and aplay -l (for speaker)
# Format: plughw:CARD,DEVICE or hw:CARD,DEVICE
# plughw: allows automatic format conversion (recommended)
# hw: requires exact format match (lower latency)

# Microphone device
MIC_DEVICE="plughw:2,0"

# Speaker device
SPEAKER_DEVICE="plughw:2,0"

# =============================================================================
# WAKE WORD SETTINGS
# =============================================================================
# Wake word model name (must match installed model)
# Available models: hey_jarvis, alexa, hey_mycroft, ok_nabu, etc.
WAKE_WORD_NAME="hey_jarvis"

# Local OpenWakeWord service URI
WAKE_WORD_URI="tcp://127.0.0.1:10400"

# Detection threshold (0.0-1.0, higher = less false positives)
WAKE_WORD_THRESHOLD="0.5"

# =============================================================================
# AUDIO PROCESSING (OPTIONAL)
# =============================================================================
# Microphone volume multiplier (1.0 = no change)
MIC_VOLUME="1.0"

# Noise suppression level (0-4, 0 = disabled)
# Higher values = more aggressive noise removal
NOISE_SUPPRESSION="0"

# Automatic gain control in dBFS (0-31, 0 = disabled)
# Normalizes audio volume automatically
AUTO_GAIN="0"

# Voice Activity Detection (true/false)
# Helps detect when speech ends
VAD_ENABLED="true"

# =============================================================================
# SATELLITE SETTINGS
# =============================================================================
# Name of this satellite (shown in logs)
SATELLITE_NAME="jarvis-pi"

# Awake sound (played when wake word detected)
# Leave empty to disable
AWAKE_SOUND=""

# Done sound (played when processing complete)
# Leave empty to disable
DONE_SOUND=""
